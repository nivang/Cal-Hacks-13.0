[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel"
version = "0.1.0"
description = "MCP server that holds the wallet, guards every agent payment and keeps the books"
requires-python = ">=3.13"
dependencies = [
    "cdp-sdk==1.51.0",
    "x402[evm,httpx,fastapi]==2.25.0",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "python-dotenv==1.2.4",
    "psycopg[binary,pool]==3.3.6",
    "psycopg-pool==3.3.3",
    "fastmcp==4.1.0",
    "Jinja2==3.1.6",
    "python-multipart==0.0.32",
    "email-validator==2.3.0",
    "anthropic==2.3.0",
    # Injection screen runtime (sentinel/models/injection): the pickled vectorizer needs these exact versions.
    "scikit-learn==1.7.2",
    "joblib==1.5.2",
    "numpy==2.5.4",
    "scipy==1.18.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.2", "mypy==2.4.0"]
ml = ["xgboost==3.1.1"]  # training only; the server evaluates saved trees in plain Python

[tool.setuptools]
packages = ["sentinel", "sentinel.web", "demo", "test_site"]

[tool.setuptools.package-data]
sentinel = ["policy.json", "templates/*.html", "migrations/*.sql", "models/injection/*"]
"sentinel.web" = ["templates/*.html", "templates/account_sections/*.html", "static/*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.isort]
known-first-party = ["sentinel", "demo"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
