{% extends "base.html" %}
{% block title %}Sign in · Sentinel{% endblock %}
{% block content %}
<h1 class="text-2xl font-semibold tracking-tight">Sign in</h1>
<p class="mt-2 text-stone-700">We email you a link that signs you in. No password.</p>
{% if error %}
<p class="mt-4 rounded-md border border-red-200 bg-red-50 p-3 text-sm text-red-800" role="alert">{{ error }}</p>
{% endif %}
<form method="post" action="/signin" class="mt-6 space-y-4">
  <label class="block">
    <span class="text-sm font-medium">Email address</span>
    <input type="email" name="email" value="{{ email }}" required autocomplete="email" maxlength="254"
           class="mt-1 block w-full rounded-md border border-stone-300 bg-white px-3 py-2">
  </label>
  {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
  <button type="submit" class="rounded-md bg-stone-900 px-4 py-2 font-medium text-white">Email me a sign in link</button>
</form>
{% endblock %}
