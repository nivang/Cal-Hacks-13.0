{% extends "base.html" %}
{% block body %}
<section style="max-width: 360px; margin: 80px auto;">
  <h1>Sentinel ledger</h1>
  <p class="muted">Owner only. Agents cannot sign in here.</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="/login" style="margin-top: 16px; display: grid; gap: 10px;">
    <input type="password" name="password" placeholder="Owner password" autocomplete="current-password" required autofocus>
    <button class="primary" type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
