{% macro placeholder(name, label) -%}
<section class="mt-6 border-b border-stone-200 pb-6" data-account-section="{{ name }}" aria-label="{{ label }}" aria-busy="true">
  <h2 class="font-semibold">{{ label }}</h2>
  <p data-loading-message role="status" class="mt-2 text-sm text-stone-600">Loading…</p>
  <div data-loading-placeholder class="mt-3 space-y-3 motion-safe:animate-pulse" aria-hidden="true">
    <div class="h-4 w-1/3 rounded bg-stone-200"></div>
    <div class="h-4 w-2/3 rounded bg-stone-100"></div>
  </div>
  <button data-loading-retry type="button" hidden class="mt-4 rounded-md border border-stone-300 px-3 py-2 text-sm font-medium">Try again</button>
</section>
{%- endmacro %}
