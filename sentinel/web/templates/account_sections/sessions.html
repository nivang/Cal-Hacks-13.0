{% from "account_macros.html" import danger %}
<details class="mt-6 border-b border-stone-200 pb-6">
  <summary id="out-h" class="cursor-pointer font-semibold">Sessions and access</summary>
  <p class="mt-1 text-sm text-stone-700">This ends every browser session and disconnects every app you approved. You will have to connect your AI app again.</p>
  <form method="post" action="/account/signout-everywhere" class="mt-3">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <button type="submit" class="{{ danger }}">Sign out everywhere</button>
  </form>
</details>
