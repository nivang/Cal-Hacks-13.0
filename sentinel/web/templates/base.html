<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="same-origin">
<title>{% block title %}Sentinel{% endblock %}</title>
<link rel="icon" href="/favicon.ico" type="image/svg+xml">
<link rel="stylesheet" href="/static/site.css">
</head>
<body class="{% block body_class %}sentinel-theme public-site min-h-screen bg-stone-50 text-stone-900 antialiased{% endblock %}">
{% block header %}<header class="border-b border-stone-200 bg-white">
  <div class="mx-auto flex {% block width %}max-w-xl{% endblock %} items-center justify-between px-4 py-3">
    <a href="/" class="flex items-center gap-2 font-semibold tracking-tight">
      <img src="/favicon.ico" alt="" width="20" height="20"> Sentinel
    </a>
    {% block nav %}{% endblock %}
  </div>
</header>{% endblock %}
<main id="main-content" class="{% block main_class %}mx-auto {{ self.width() }} min-w-0 px-4 py-10{% endblock %}">
{% block content %}{% endblock %}
</main>
<footer class="{% block footer_class %}mx-auto {{ self.width() }} px-4 pb-10 text-xs text-stone-500{% endblock %}">
  Sentinel holds your agent's wallet and checks every payment against your rules. Base Sepolia test network.
</footer>
</body>
</html>
